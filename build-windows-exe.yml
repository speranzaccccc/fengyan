name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows.txt

      - name: Build EXE
        run: |
          python -m PyInstaller --clean --noconfirm fund_analyzer_windows.spec

      - name: Prepare download package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "dist\基金净值分析工具.exe" "release\基金净值分析工具.exe"
          @"
          私募基金净值分析工具

          使用方法：
          1. 双击“基金净值分析工具.exe”。
          2. 上传 .xlsx/.xlsm 净值文件。
          3. 查看界面结果或导出 Excel 分析结果。

          说明：
          - 使用这台 Windows 电脑不需要安装 Python。
          - 如果 Windows 安全提示未知发布者，请选择“更多信息”后继续运行。
          "@ | Set-Content -Encoding UTF8 "release\使用说明.txt"

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe-基金净值分析工具
          path: release/*
